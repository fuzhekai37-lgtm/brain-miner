[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-miner"
version = "0.1.0"
description = "Configurable, bounded Alpha research workflows for WorldQuant BRAIN"
requires-python = ">=3.11"
dependencies = ["requests>=2.32.0,<3"]
license = {text = "MIT"}

[project.scripts]
brain-miner = "brain_miner.cli:main"

[tool.setuptools.packages.find]
include = ["brain_miner*"]
